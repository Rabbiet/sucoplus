name: Production Live Deploy (Root FTP)

on:
  push:
    branches:
      - main

jobs:
  deploy-to-cpanel:
    name: Sync Code to cPanel via Root FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🚀 Sync Files via FTP Action
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_TARGET_DIR }}
          protocol: ftp
          port: 21
          exclude: |
            **/.git*
            **/.git*/**
            .env*
            tests/**
            README.md
            AI_LOGBOOK.md
            .vscode/**
            .idea/**
            *.zip
            *.sql